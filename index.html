<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下考古潜水记录</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #e8f2f3; color: #183035; }
    header { padding: 18px 24px; background: #fff; border-bottom: 1px solid #c9dadc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 17px; margin: 14px 0 8px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #1d6c78; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #64777b; }
    button:disabled { background: #aebcbf; cursor: not-allowed; }
    input, select, textarea { width: 100%; border: 1px solid #c9dadc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    textarea { min-height: 64px; }
    label { display: block; margin: 9px 0 5px; color: #5c7378; font-size: 13px; }
    fieldset { border: 0; margin: 0; padding: 0; }
    fieldset:disabled label { color: #95a7ab; }
    .app { display: grid; grid-template-columns: 1fr 360px; gap: 16px; padding: 16px; }
    .panel { background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 14px; }
    .divebar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .divebar select { width: auto; min-width: 132px; }
    .divebar #reviewer { width: 130px; }
    .divebar button { padding: 8px 11px; }
    #diveStatus { font-size: 13px; color: #466167; flex-basis: 100%; }
    #diveError { flex-basis: 100%; color: #a33b2f; font-size: 13px; }
    .map { position: relative; height: calc(100vh - 196px); min-height: 520px; overflow: hidden; background: radial-gradient(circle at 30% 20%, #5fa8b1, #0f5262 55%, #07333f); border-radius: 8px; border: 1px solid #0c4451; cursor: crosshair; }
    .wreck { position: absolute; left: 24%; top: 28%; width: 52%; height: 31%; border: 3px solid rgba(220,235,224,.55); border-radius: 48% 44% 42% 50%; transform: rotate(-9deg); }
    .rib { position: absolute; width: 2px; height: 36%; background: rgba(220,235,224,.35); top: 27%; transform: rotate(-9deg); }
    .marker { position: absolute; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 4px 12px rgba(0,0,0,.35); cursor: pointer; padding: 0; }
    .marker.selected { outline: 4px solid rgba(255,234,124,.75); }
    .marker.revised { outline: 3px solid rgba(247,163,55,.95); }
    .ceramic { background: #b56c38; } .wood { background: #6c4b2f; } .metal { background: #6e7880; } .unknown { background: #725ca6; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .list { display: grid; gap: 8px; max-height: 420px; overflow: auto; }
    .timeline { display: grid; gap: 10px; max-height: 640px; overflow: auto; }
    .item { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; cursor: pointer; }
    .item.active { border-color: #1d6c78; background: #eef8f9; }
    .dive-group.removed { opacity: .65; }
    .dive-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
    .tl-event { border-left: 3px solid #cfe0e2; padding: 5px 9px; font-size: 13px; cursor: pointer; border-radius: 0 6px 6px 0; }
    .tl-event:hover { background: #f4f9f9; }
    .tl-event.create { border-color: #7fb4bd; }
    .tl-event.late-add { border-color: #a888c9; }
    .tl-event.revise { border-color: #e2b073; background: #fdf8f0; }
    .tl-event.signoff { border-color: #7fae8a; cursor: default; }
    .tl-event.signoff:hover, .tl-event.remove:hover { background: transparent; }
    .tl-event.remove { border-color: #b96a5c; background: #fcf1ef; cursor: default; }
    .time { color: #7d9297; font-size: 12px; }
    .pill { display: inline-block; padding: 3px 8px; border: 1px solid #c9dadc; border-radius: 999px; font-size: 12px; background: #fff; }
    .pill.ok { background: #e3f2e6; border-color: #9cc6a4; color: #2f6b3c; }
    .pill.warn { background: #fdf0dd; border-color: #e2b073; color: #8a531d; }
    .pill.dead { background: #eceff0; border-color: #c3ccd0; color: #647278; }
    .banner { background: #eef4f9; border: 1px solid #bcd3e2; color: #274b5f; border-radius: 8px; padding: 9px 10px; margin: 0 0 10px; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .banner button { padding: 6px 10px; font-size: 12px; }
    #revisionBox { background: #fdf6ec; border: 1px solid #e2b073; border-radius: 8px; padding: 0 10px 8px; margin-top: 10px; }
    #revisionBox label { color: #8a531d; font-weight: 700; }
    .form-error { color: #a33b2f; font-size: 13px; min-height: 18px; margin: 6px 0 0; }
    .muted { color: #5c7378; font-size: 13px; }
    @media (max-width: 980px) { header { display: block; } .app { grid-template-columns: 1fr; } .map { height: 520px; } }
  </style>
</head>
<body>
  <header>
    <div><h1>水下考古潜水记录</h1><div class="muted">签核前可直接覆盖编辑；潜次签核后更正将新建修订版本，旧记录保留并标记已被替代。地图与导出只取每个标本的最新版本。</div></div>
    <button id="exportBtn">导出JSON（最新版本）</button>
  </header>
  <main class="app">
    <section class="panel">
      <div class="divebar">
        <strong>潜次</strong>
        <select id="diveSelect"></select>
        <input id="reviewer" placeholder="审核员姓名">
        <button id="signBtn">签核潜次</button>
        <button id="removeDiveBtn" type="button" class="secondary">移除潜次</button>
        <button id="addDiveBtn" type="button" class="secondary">新建潜次</button>
        <div id="diveStatus"></div>
        <div id="diveError"></div>
      </div>
      <div class="map" id="map"><div class="wreck"></div></div>
    </section>
    <aside class="panel">
      <div class="toolbar">
        <select id="filter"><option value="">全部类型</option><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
        <select id="view"><option value="list">标记列表</option><option value="timeline">历史时间线</option></select>
      </div>
      <form id="form">
        <h2>标本信息</h2>
        <div id="readonlyBanner" class="banner" hidden>
          <span id="readonlyText"></span>
          <button type="button" id="resumeBtn" class="secondary">查看最新版本</button>
        </div>
        <input name="specimenId" type="hidden">
        <fieldset id="fields">
          <label>编号</label><input name="code" required>
          <label>类型</label><select name="type"><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
          <label>所属潜次</label><select name="dive" required></select>
          <label>深度</label><input name="depth" placeholder="例如18.4m" required>
          <label>朝向</label><input name="orientation" placeholder="例如东北偏北">
          <label>保存状态</label><input name="condition" placeholder="例如表面附着贝类">
          <label>备注</label><textarea name="note"></textarea>
          <div id="revisionBox" hidden>
            <label id="reasonLabel">修订原因（必填）</label>
            <textarea id="revisionReason" placeholder="例如：现场复核坐标，原记录偏北约2米"></textarea>
          </div>
        </fieldset>
        <div class="toolbar" style="margin-top:10px">
          <button id="submitBtn">保存标记</button>
          <button type="button" id="deleteBtn" class="secondary">删除</button>
        </div>
        <p id="formError" class="form-error"></p>
      </form>
      <h2 id="listTitle">标记列表</h2>
      <div id="list" class="list"></div>
    </aside>
  </main>
  <script src="js/store.js"></script>
  <script src="js/domain.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
