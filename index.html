<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下考古潜水记录</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #e8f2f3; color: #183035; }
    header { padding: 18px 24px; background: #fff; border-bottom: 1px solid #c9dadc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 17px; margin: 14px 0 8px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #1d6c78; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #64777b; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    input, select, textarea { width: 100%; border: 1px solid #c9dadc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    input:disabled, select:disabled { background: #eef3f4; color: #7b8f94; }
    textarea { min-height: 64px; }
    label { display: block; margin: 9px 0 5px; color: #5c7378; font-size: 13px; }
    .app { display: grid; grid-template-columns: 1fr 380px; gap: 16px; padding: 16px; }
    .panel { background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 14px; }
    .map { position: relative; height: calc(100vh - 128px); min-height: 560px; overflow: hidden; background: radial-gradient(circle at 30% 20%, #5fa8b1, #0f5262 55%, #07333f); border-radius: 8px; border: 1px solid #0c4451; cursor: crosshair; }
    .wreck { position: absolute; left: 24%; top: 28%; width: 52%; height: 31%; border: 3px solid rgba(220,235,224,.55); border-radius: 48% 44% 42% 50%; transform: rotate(-9deg); }
    .rib { position: absolute; width: 2px; height: 36%; background: rgba(220,235,224,.35); top: 27%; transform: rotate(-9deg); }
    .marker { position: absolute; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 4px 12px rgba(0,0,0,.35); cursor: pointer; }
    .marker.selected { outline: 4px solid rgba(255,234,124,.75); }
    .ceramic { background: #b56c38; } .wood { background: #6c4b2f; } .metal { background: #6e7880; } .unknown { background: #725ca6; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .list { display: grid; gap: 8px; max-height: 300px; overflow: auto; }
    .item { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; cursor: pointer; }
    .item.active { border-color: #1d6c78; background: #eef8f9; }
    .timeline { display: grid; gap: 8px; max-height: 300px; overflow: auto; }
    .timeline .item { cursor: default; }
    .pill { display: inline-block; padding: 3px 8px; border: 1px solid #c9dadc; border-radius: 999px; font-size: 12px; }
    .muted { color: #5c7378; font-size: 13px; }
    .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .chip.signed { background: #e3f2e5; color: #1f6b34; border: 1px solid #b9dcc0; }
    .chip.unsigned { background: #fdf3e0; color: #8a5a00; border: 1px solid #ecd9a8; }
    .tag { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 12px; margin-left: 5px; }
    .tag.sealed { background: #e3f2e5; color: #1f6b34; }
    .tag.rev { background: #e8eef8; color: #2d4f86; }
    .tag.current { background: #e3f2e5; color: #1f6b34; }
    .tag.superseded { background: #f3e2e2; color: #8c2f2f; }
    .tag.removed { background: #f3e2e2; color: #8c2f2f; }
    .banner { display: none; background: #fdf3e0; border: 1px solid #ecd9a8; color: #8a5a00; border-radius: 8px; padding: 9px 11px; font-size: 13px; margin-bottom: 6px; }
    .dive-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid #d7e4e5; border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; }
    .dive-row button { padding: 7px 10px; white-space: nowrap; }
    .spec { border-top: 1px dashed #d7e4e5; margin-top: 8px; padding-top: 8px; }
    .spec summary { cursor: pointer; }
    .versions { display: grid; gap: 6px; margin-top: 8px; }
    .version { border-left: 3px solid #1d6c78; background: #f4f9fa; border-radius: 6px; padding: 7px 9px; }
    .version.old { border-left-color: #b9c6c8; background: #f7f7f5; }
    .removed-note { color: #8c2f2f; font-size: 13px; margin-top: 6px; }
    .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: #183035; color: #fff; padding: 10px 16px; border-radius: 8px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 30; max-width: 80vw; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: #8c2f2f; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(7, 51, 63, .45); display: none; place-items: center; z-index: 20; }
    .modal-overlay.show { display: grid; }
    .modal { background: #fff; border-radius: 10px; padding: 18px; width: min(420px, 92vw); }
    .modal h3 { margin: 0 0 6px; }
    .modal .error { color: #8c2f2f; font-size: 13px; min-height: 18px; margin-top: 6px; }
    .modal .toolbar { margin-top: 10px; margin-bottom: 0; }
    @media (max-width: 980px) { header { display: block; } .app { grid-template-columns: 1fr; } .map { height: 560px; } }
  </style>
</head>
<body>
  <header>
    <div><h1>水下考古潜水记录</h1><div class="muted">点击沉船平面图添加标本标记；潜次签核后数据定稿，更正会留下修订历史。</div></div>
    <button id="exportBtn">导出JSON（最新版本）</button>
  </header>
  <main class="app">
    <section class="panel">
      <div class="map" id="map"><div class="wreck"></div></div>
    </section>
    <aside class="panel">
      <h2>潜次签核</h2>
      <div id="diveList"></div>

      <div class="toolbar">
        <select id="filter"><option value="">全部类型</option><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
        <select id="view"><option value="list">标本列表</option><option value="timeline">潜次时间线</option></select>
      </div>

      <form id="form">
        <h2>标本信息</h2>
        <div class="banner" id="sealedBanner">所属潜次已签核：保存将生成新修订版本，请填写修订原因；编号与潜次不可再改。</div>
        <input name="id" type="hidden">
        <label>编号</label><input name="code" required>
        <label>类型</label><select name="type"><option value="ceramic">陶片</option><option value="wood">木构件</option><option value="metal">金属件</option><option value="unknown">未知物</option></select>
        <label>潜次</label>
        <select id="diveSelect" name="dive"></select>
        <div id="newDiveRow" style="display:none"><label>新潜次编号</label><input id="newDiveInput" placeholder="例如 DIVE-03"></div>
        <label>深度</label><input name="depth" placeholder="例如18.4m" required>
        <label>朝向</label><input name="orientation" placeholder="例如东北偏北">
        <label>保存状态</label><input name="condition" placeholder="例如表面附着贝类">
        <label>备注</label><textarea name="note"></textarea>
        <div id="reasonRow" style="display:none"><label>修订原因（已签核标本必填）</label><textarea id="revisionReason" placeholder="例如：坐标复测修正 / 保存状态描述更正"></textarea></div>
        <div class="toolbar"><button id="submitBtn">保存标记</button><button type="button" id="deleteBtn" class="secondary">删除</button></div>
      </form>

      <h2 id="listTitle">标本列表</h2>
      <div id="list" class="list"></div>
    </aside>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalTitle">移除标本</h3>
      <div class="muted" id="modalHint"></div>
      <label>原因（必填）</label>
      <textarea id="modalReason" placeholder="例如：现场复核确认为扰动堆积，非原生遗存"></textarea>
      <div class="error" id="modalError"></div>
      <div class="toolbar"><button id="modalOk">确认移除</button><button id="modalCancel" class="secondary">取消</button></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <!-- 分层：数据存取 → 规则判断 → 页面展示 -->
  <script src="js/data-store.js"></script>
  <script src="js/domain.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
